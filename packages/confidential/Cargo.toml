[package]
name = "stellar-confidential"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true
description = "Confidential token with encrypted balances and zero-knowledge proofs for the Stellar contracts."

[package.metadata.stellar]
cargo_inherit = true

# `lib` only, `publish = false`, and no `alloc` feature on `soroban-sdk`: see
# README.md#packaging.
[lib]
crate-type = ["lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
soroban-poseidon = { workspace = true }
stellar-contract-utils = { workspace = true }
ultrahonk-soroban-verifier = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
